name: Update events

on:
  schedule:
    - cron: "17 10 * * *" # every morning, around 6 am Eastern
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install icalendar recurring_ical_events
      - run: python scripts/update_events.py
      - run: python scripts/update_news.py
        continue-on-error: true # if CBFP.news is down, still save the events
      - name: Commit if the events changed
        run: |
          # Ignore the "Last updated" line so a quiet day doesn't make a commit.
          if git diff -U0 auto-events.js | grep '^[-+][^-+]' | grep -qv 'Last updated'; then
            git config user.name "github-actions[bot]"
            git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
            git add auto-events.js
            git commit -m "Update events"
            git push
          else
            echo "No changes to events."
          fi
      - name: Commit if the CBFP.news articles changed
        run: |
          if git diff -U0 cbfp-news.js | grep '^[-+][^-+]' | grep -qv 'Last updated'; then
            git config user.name "github-actions[bot]"
            git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
            git add cbfp-news.js
            git commit -m "Update CBFP.news articles"
            git push
          else
            echo "No new CBFP.news articles."
          fi
