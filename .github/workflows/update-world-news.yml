name: Update world news

on:
  schedule:
    - cron: "43 * * * *" # every hour
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-world-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_world_news.py
      - name: Commit if the headlines changed
        run: |
          # Ignore the timestamp lines so an hour with no new stories doesn't make a commit.
          if git diff -U0 world-news.js | grep '^[-+][^-+]' | grep -qv 'Last updated\|WORLD_NEWS_UPDATED'; then
            git config user.name "github-actions[bot]"
            git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
            git add world-news.js
            git commit -m "Update world news"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          else
            echo "No new world headlines."
          fi
